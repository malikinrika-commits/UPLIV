services:
  - type: web
    name: upliv-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: SMTP_HOST
        value: mail.genuprotechnology.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: contact@genuprotechnology.com
      - key: SMTP_PASS
        sync: false
      - key: CONTACT_EMAIL
        value: contact@genuprotechnology.com
      - key: CORS_ORIGINS
        value: https://malikinrika-commits.github.io
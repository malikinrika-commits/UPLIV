services:
  - type: web
    name: upliv-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_EMAIL
        value: contact@genuprotechnology.com
      - key: CORS_ORIGINS
        value: https://malikinrika-commits.github.io